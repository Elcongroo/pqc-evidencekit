[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "pqc-evidencekit"
version = "0.1.0"
description = "Reproducible TLS 1.3 hybrid key-establishment observations"
readme = "README.en.md"
requires-python = ">=3.10"
license = {file = "LICENSE"}
dependencies = []
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Topic :: Security",
]

[project.scripts]
pqc-evidencekit = "pqc_evidencekit.__main__:main"

[tool.setuptools.packages.find]
include = ["pqc_evidencekit*"]
